services:
  bd:
    ports:
      - "5432:5432"

  backend:
    build:
      target: dev
    volumes:
      - ./backend/src:/app/src
      - scraper_output:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      target: dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  scraper:
    build:
      target: dev
