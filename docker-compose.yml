services:
  bd:
    image: postgres:16-alpine
    container_name: bd
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./bd/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [appnet]

  backend:
    container_name: backend
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}
      INGEST_DIR: ${INGEST_DIR:-/data}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-0}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
    depends_on:
      bd:
        condition: service_healthy
    volumes:
      - scraper_output:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [appnet]

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    networks: [appnet]

  scraper:
    container_name: scraper
    build:
      context: ./scraping
    environment:
      BACKEND_URL: ${BACKEND_URL}
      SCRAPER_CRON: ${SCRAPER_CRON}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - scraper_output:/data
    networks: [appnet]

volumes:
  pgdata:
  scraper_output:

networks:
  appnet:
    driver: bridge
