name: CI

on:
  push:
    branches: ['**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d autoai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # setdefault en conftest.py NO pisa esto -> integración apunta al service container
      DATABASE_URL: postgresql://test:test@localhost:5432/autoai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install --upgrade pip
      - run: pip install -r requirements-dev.txt

      # Lint/format (bloquea ante errores de ruff)
      - name: Ruff (lint)
        run: ruff check .

      # mypy gradual: informativo, no bloquea el build
      - name: Mypy (gradual, no bloqueante)
        run: mypy src || true

      # Tests + cobertura (pytest.ini ya añade --cov=src; añadimos xml/html informativos)
      - name: Pytest con cobertura
        run: pytest --cov-report=xml --cov-report=html

      - name: Subir cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # tsc -b + vite build (typecheck incluido)
      - name: Vitest (si existe el script test)
        run: npm test --if-present

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen backend (sin push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - name: Build imagen frontend (sin push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_URL=http://localhost:8000
