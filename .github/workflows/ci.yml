name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoai
        ports:
          - 5432:5432
        # Espera a que Postgres acepte conexiones antes de arrancar los pasos.
        options: >-
          --health-cmd "pg_isready -U test -d autoai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Apunta al service container; el fixture db_con_datos aplica el esquema
      # (DROP + bd/init.sql), así que el tests son autocontenidos y los
      # @pytest.mark.integration corren (la conexión tiene éxito -> sin skip).
      DATABASE_URL: postgresql://test:test@localhost:5432/autoai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
