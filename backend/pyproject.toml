[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Conjunto razonable y no agresivo; ampliable más adelante.
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # longitud de línea la gestiona el formateador, no bloquea

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true   # modo gradual: no exige stubs de terceros
follow_imports = "silent"
warn_unused_ignores = false
# Sin strict global: solo errores claros bloquean.
check_untyped_defs = false
disallow_untyped_defs = false
